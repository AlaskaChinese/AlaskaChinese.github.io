<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>页面跳转中 - AlaskaChinese's Blog</title>
  <script>
    // GitHub Pages SPA 404 router redirect
    const path = window.location.pathname;
    const cleanPath = path.replace(/^\/AlaskaChinese\.github\.io/, '').replace(/^\//, '');
    if (cleanPath) {
      window.location.replace('/#/' + cleanPath);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>正在前往页面，请稍候...</p>
</body>
</html>
